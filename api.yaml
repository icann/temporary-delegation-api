openapi: 3.1.0

info:
  title: Temporary Delegation API (DRAFT)
  version: v1
  contact:
    name: Jakob Schlyter
    email: jakob.schlyter@icann.org

servers:
  - url: /api/v1

security:
  - basic: []

paths:

  '/domains':
    get:
      summary: Get all domains
      responses:
        "200":
          description: Brief list of all domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain_list_response'
              examples:
                example-1:
                  value:
                    domains:
                      - name: tld
                        state: NI
                        requested_state: NI
                      - name: xn--rksmrgs-5wao1o
                        state: NI
                        requested_state: CI

  '/domain':
    post:
      summary: Create domain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain_create_request'
            examples:
              example-1:
                value:
                  name: tld
                  requested_state: NI
        required: true
      responses:
        "201":
          description: Domain created
          headers:
            Location:
              description: URL of the created domain
              schema:
                type: string

  '/domain/{domain_name}':
    get:
      summary: Get domain
      parameters:
        - name: domain_name
          description: Domain name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/domain_name'
      responses:
        "200":
          description: Domain information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain_full_response'

    delete:
      summary: Delete domain
      parameters:
        - name: domain_name
          description: Domain name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/domain_name'
      responses:
        "202":
          description: Domain deleted

    patch:
      summary: Update domain
      parameters:
        - name: domain_name
          description: Domain name
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/domain_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain_update_request'
            examples:
              example-1:
                value:
                  additional_rrs:
                    - "label.example.tld. IN A 192.0.2.1"
                    - "label.example.tld. IN AAAA 2001:DB8::1"
              example-2:
                value:
                  requested_state: VIN
        required: true
      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain_full_response'


components:

  securitySchemes:
    basic:
      type: http
      scheme: basic

  schemas:
    domain_name:
      description: Domain name labe
      type: string
      pattern: "^[a-z][a-z0-9\\-]+$"
      examples:
        - tld
        - xn--rksmrgs-5wao1o

    fqdn:
      type: string
      pattern: "^[a-zA-Z0-9\\-]+(\\.[a-zA-Z0-9\\-]+)*$"
      examples:
        - ns1.example.com

    nameservers:
      description: List of nameservers for the domain (read-only field)
      type: array
      minItems: 2
      items:
        $ref: '#/components/schemas/fqdn'

    domain_state:
      type: string
      enum:
        - NI             # No interruption (default state)
        - CI             # Controlled interruption
        - VI             # Visible interruption
        - VIN            # Visible interruption with notification

    domain_list_response:
      type: object
      required:
        - domains
      properties:
        domains:
          type: array
          items:
            $ref: '#/components/schemas/domain_brief_response'

    domain_brief_response:
      type: object
      required:
        - name
        - state
      properties:
        name:
          $ref: '#/components/schemas/domain_name'
        state:
          $ref: '#/components/schemas/domain_state'
        requested_state:
          $ref: '#/components/schemas/domain_state'

    domain_full_response:
      type: object
      required:
        - name
        - nameservers
        - state
        - created
      properties:
        name:
          $ref: '#/components/schemas/domain_name'
        nameservers:
          $ref: '#/components/schemas/nameservers'
        state:
          $ref: '#/components/schemas/domain_state'
        requested_state:
          $ref: '#/components/schemas/domain_state'
        created:
          description: Creation timestamp of the domain (read-only))
          type: string
          format: date-time
        last_modified:
          description: Last modification timestamp of the domain (read-only))
          type: string
          format: date-time
        additional_rrs:
          $ref: '#/components/schemas/additional_rrs'

    domain_create_request:
      type: object
      required:
        - name
        - requested_state
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/domain_name'
        requested_state:
          $ref: '#/components/schemas/domain_state'
        additional_rrs:
          $ref: '#/components/schemas/additional_rrs'

    domain_update_request:
      type: object
      additionalProperties: false
      properties:
        requested_state:
          $ref: '#/components/schemas/domain_state'
        additional_rrs:
          $ref: '#/components/schemas/additional_rrs'

    additional_rrs:
      description: |
        List of additional DNS resource records in zone file format as defined
        in RFC 1035 section 5.1. All records must follow the proper zone file format and
        must have an origin below the domain name specified in the request.
      type: array
      items:
        type: string
        examples:
          - "label.example.tld. IN A 192.0.2.1"
          - "label.example.tld. IN AAAA 2001:DB8::1"
